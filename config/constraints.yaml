# Ограничения и критерии системы.
#
# ВАЖНО. Всё, что помечено ДОПУЩЕНИЕ, — не паспортные пределы установки,
# а модельные границы, заданные командой по истории и открытым источникам.
# ТЗ прямо запрещает выдавать исторический min/max за промышленный предел,
# поэтому каждое такое число должно быть перечислено в README.

# --- Жёсткие ограничения: нарушать нельзя ничем и никогда ---
hard:
  product_sulfur_mg_kg:
    max: 10.0
    source: "ТЗ хакатона, раздел 4 «Минимальные жёсткие проверки»"
    # Проверяем ВЕРХНЮЮ границу прогноза, а не медиану: рекомендация,
    # которая проходит по медиане и валится по p90, небезопасна.
    check_on: p90
  blend_fractions_sum:
    equals: 1.0
    tolerance: 1.0e-6
    source: "ТЗ хакатона, раздел 4"

# --- Свежесть данных: старше порога — источнику не верим ---
freshness:
  telemetry_max_age_min: 30
  pak_max_age_min: 60      # ДОПУЩЕНИЕ: поточный анализатор пишет раз в 10 мин
  lims_max_age_h: 48       # ДОПУЩЕНИЕ: лаборатория даёт 1-2 замера в сутки

# --- Порог доверия к данным, ниже которого система отказывается советовать ---
data_quality:
  min_score: 0.6
  # Значение-маркер залипшего датчика, найдено при разведке данных
  sentinel_value: 307.0
  # Потолок шкалы поточного анализатора серы: значения «20» цензурированы
  sulfur_analyzer_ceiling: 20.0

# --- Ограничения на скорость изменения режима за один цикл ---
# ДОПУЩЕНИЕ: без паспортных данных берём долю от модельного диапазона тега.
rate_limits:
  default_share_of_range: 0.05
  overrides:
    # Температуру реактора двигают медленно и малыми шагами
    GO:T5: {max_step_abs: 2.0, unit: "°C"}
    GO:T6: {max_step_abs: 2.0, unit: "°C"}

# --- Критерии сравнения допустимых вариантов ---
# Качество в свёртку НЕ входит: оно проверяется жёстко, до сравнения.
objective_weights:
  throughput: 0.40   # выпуск
  energy: 0.30       # энергозатраты (прокси: нагрузка печей + расход ВСГ)
  severity: 0.30     # тяжесть режима / риск для катализатора

# --- Разбиение по времени: без утечки из будущего ---
split:
  train: ["2023-01-01", "2025-06-30"]
  valid: ["2025-07-01", "2025-12-31"]
  test:  ["2026-01-01", "2026-08-07"]
  embargo_hours: 6   # зазор между кусками, чтобы лаги не подглядывали вперёд
