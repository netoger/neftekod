[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neftekod"
version = "0.1.0"
description = "Мультиагентная система-советчик оператору НПЗ (хакатон Нефтекод-2026)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
